[project]
name = "shining-chatbot"
version = "0.1.0"
description = "Streamlit workspace for field work plans, safety actions, TBM briefings, and accident records"
readme = "README.md"
authors = [
    { name = "kimgomja", email = "kimgomja1234@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "altair>=6.3.0",
    "langchain>=1.4.3",
    "langchain-openai>=1.6.7",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "streamlit>=1.64.0",
]

[project.scripts]
shining-chatbot = "shining_chatbot:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"
